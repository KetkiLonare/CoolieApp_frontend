<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#tricolor)" stroke="white" stroke-width="5"></circle>

  <!-- Travel bag handle -->
  <rect x="70" y="55" width="60" height="12" rx="6" fill="white" opacity="0.9"></rect>

  <!-- Main bag body -->
  <rect x="55" y="65" width="90" height="80" rx="16" fill="white" opacity="0.95"></rect>

  <!-- AI spark -->
  <circle cx="100" cy="105" r="8" fill="url(#aiSpark)"></circle>
  <circle cx="100" cy="105" r="14" fill="none" stroke="url(#aiSpark)" stroke-width="3" opacity="0.8"></circle>

  <!-- Text M -->
  <text x="100" y="145" text-anchor="middle" font-family="Poppins, sans-serif" font-size="42" font-weight="bold" fill="#003300">M</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="tricolor" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9933"></stop>
      <stop offset="50%" stop-color="#FFFFFF"></stop>
      <stop offset="100%" stop-color="#138808"></stop>
    </linearGradient>
    <linearGradient id="aiSpark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#007bff"></stop>
      <stop offset="100%" stop-color="#00c853"></stop>
    </linearGradient>
  </defs>
</svg>
